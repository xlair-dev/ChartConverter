name: C API Packages

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - scripts/package-c-api.py
      - scripts/test_package_c_api.py
      - rust-toolchain.toml
      - .github/workflows/package-c-api.yml

permissions:
  contents: read

concurrency:
  group: c-api-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo directories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-c-api-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-c-api-${{ matrix.target }}-

      - name: Fetch dependencies
        run: cargo fetch --locked --target "${{ matrix.target }}"

      - name: Test package helpers
        run: python -B -m unittest discover -s scripts -p test_package_c_api.py

      - name: Package static library
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: python scripts/package-c-api.py "${{ matrix.target }}"

      - name: Package static library
        if: runner.os != 'Windows'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '13.0' || '' }}
        run: python3 scripts/package-c-api.py "${{ matrix.target }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-converter-ffi-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish commit release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chart-converter-ffi-*
          path: dist
          merge-multiple: true

      - name: Check package archives
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc; do
            archive="dist/chart-converter-ffi-${target}.zip"
            test -f "$archive"
            test -f "${archive}.sha256"
          done

      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: sha-${{ github.sha }}
        run: |
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$latest_main_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping stale commit ${GITHUB_SHA}; main is at ${latest_main_sha}."
            exit 0
          fi

          title="ChartConverter C API ${GITHUB_SHA::12}"
          notes="Built from commit ${GITHUB_SHA}."
          assets=(dist/*.zip dist/*.zip.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
