name: C API Packages

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - scripts/package-c-api.py
      - rust-toolchain.toml
      - .github/workflows/package-c-api.yml

permissions:
  contents: read

concurrency:
  group: c-api-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo directories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-c-api-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-c-api-${{ matrix.target }}-

      - name: Fetch dependencies
        run: cargo fetch --locked --target "${{ matrix.target }}"

      - name: Package static library
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: python scripts/package-c-api.py "${{ matrix.target }}"

      - name: Package static library
        if: runner.os != 'Windows'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '13.0' || '' }}
        run: python3 scripts/package-c-api.py "${{ matrix.target }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-converter-ffi-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: build and publish package image
    if: needs.package.result == 'success'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chart-converter-ffi-*
          path: dist
          merge-multiple: true

      - name: Assemble image contents
        run: |
          mkdir -p dist/image/packages dist/image/archives
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc; do
            archive="dist/chart-converter-ffi-${target}.zip"
            test -f "$archive"
            test -f "${archive}.sha256"
            mkdir -p "dist/image/packages/${target}"
            unzip -q "$archive" -d "dist/image/packages/${target}"
            cp "$archive" "${archive}.sha256" dist/image/archives/
          done
          cp crates/chart-converter-ffi/README.md dist/image/README.md
          cp crates/chart-converter-ffi/package-image.Dockerfile dist/image/Dockerfile

      - name: Build package image for pull request
        if: github.event_name == 'pull_request'
        run: |
          docker buildx create --name c-api-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag chartconverter-ffi:pr-${{ github.event.number }} \
            --output type=oci,dest=dist/chartconverter-ffi.oci.tar \
            dist/image

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker buildx create --name c-api-builder --driver docker-container --use
          docker buildx inspect --bootstrap
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish package image
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chartconverter-ffi
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --push \
            dist/image
