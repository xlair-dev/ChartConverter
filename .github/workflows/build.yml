name: Cargo Build

on:
  push:
    branches:
      - main
    paths:
      - renovate.json
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/build.yml
      - .github/workflows/**
  pull_request:
    paths:
      - renovate.json
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - rust-toolchain.toml
      - rustfmt.toml
      - .github/workflows/build.yml
      - .github/workflows/**

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo directories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.profile }}-

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run cargo build
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo build --workspace --all-targets --locked --release
          else
            cargo build --workspace --all-targets --locked
          fi

      - name: Build WebAssembly binding
        run: cargo build -p xlair-sus-wasm --target wasm32-unknown-unknown --release --locked
